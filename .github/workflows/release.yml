name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like vMAJOR.MINOR.PATCH."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          gradle --no-daemon lint testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="$VERSION_CODE"

      - name: Package and verify
        run: |
          mkdir -p dist
          APK="dist/grayzen-$VERSION.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGES=$(git log --no-merges --pretty=format:'- %s' "$PREVIOUS_TAG..$GITHUB_REF_NAME")
          else
            CHANGES=$(git log --no-merges --pretty=format:'- %s' "$GITHUB_REF_NAME")
          fi
          {
            echo "Applies Android Color correction from the foreground app."
            echo
            echo "Commit: \`$GITHUB_SHA\`  "
            echo "APK SHA-256: \`$APK_SHA256\`"
            if [ -n "$CHANGES" ]; then
              echo
              echo "### Changes"
              printf '%s\n' "$CHANGES"
            fi
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "dist/grayzen-$VERSION.apk" \
            --title "grayzen-$VERSION" \
            --notes-file release-notes.md \
            --verify-tag
